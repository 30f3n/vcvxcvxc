<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محطة استخبارات الهواتف | OSINT Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #07090e; color: #e2e8f0; }
        .glow-box { box-shadow: 0 0 25px rgba(13, 148, 136, 0.15); border: 1px solid rgba(20, 184, 166, 0.2); }
        .terminal-glow { text-shadow: 0 0 10px rgba(45, 212, 191, 0.5); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-[#07090e] to-black">

    <header class="w-full max-w-3xl text-center mt-8 mb-6">
        <h1 class="text-3xl md:text-4xl font-black text-teal-400 terminal-glow mb-2">بحث استخباراتي عن أرقام الهواتف</h1>
        <p class="text-slate-400 text-sm">أدخل رقم الهاتف المطلوب للاستعلام عنه عبر شبكة العقد والمستودعات الرقمية المشفرة.</p>
    </header>

    <main class="w-full max-w-2xl bg-slate-900/80 backdrop-blur-md rounded-2xl p-6 glow-box mb-8">
        <form id="osintForm" class="space-y-4">
            <div>
                <label for="phoneNumber" class="block text-sm font-semibold text-teal-300 mb-2">أدخل رقم الهاتف (مثال: 9647xxxxxxxx+)</label>
                <div class="relative">
                    <input type="text" id="phoneNumber" required placeholder="9647500000000" 
                        class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:border-teal-500 font-mono">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full py-3.5 bg-gradient-to-r from-teal-600 to-emerald-600 text-white font-bold rounded-xl shadow-lg transition-all flex items-center justify-center space-x-2 space-x-reverse">
                <span id="btnText">بدء التحقيق الشامل</span>
                <svg id="loadingSpinner" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </form>
    </main>

    <div id="resultContainer" class="w-full max-w-2xl bg-slate-900/90 border border-slate-800 rounded-2xl p-6 mb-12 hidden shadow-2xl">
        <h3 class="text-teal-400 font-bold mb-3">تقرير البحث الشامل</h3>
        <div id="resultText" class="font-mono text-sm text-slate-300 whitespace-pre-wrap bg-slate-950 p-4 rounded-xl max-h-96 overflow-y-auto"></div>
    </div>

    <div id="errorContainer" class="w-full max-w-2xl bg-rose-950/40 border border-rose-900/50 rounded-2xl p-4 mb-12 hidden text-center">
        <p class="text-rose-400 text-sm font-semibold" id="errorText">حدث خطأ</p>
    </div>

    <script>
        document.getElementById('osintForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const phone = document.getElementById('phoneNumber').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('loadingSpinner');
            const resultContainer = document.getElementById('resultContainer');
            const resultText = document.getElementById('resultText');
            const errorContainer = document.getElementById('errorContainer');
            const errorText = document.getElementById('errorText');

            resultContainer.classList.add('hidden');
            errorContainer.classList.add('hidden');
            submitBtn.disabled = true;
            btnText.textContent = 'جاري التحقيق...';
            spinner.classList.remove('hidden');

            try {
                // الاتصال بمسار الـ Serverless الداخلي
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: phone })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error);

                let rawText = data.reply || data.message || data.content || JSON.stringify(data, null, 2);
                resultText.textContent = rawText.replace(/[\*_`#]/g, '').trim();
                resultContainer.classList.remove('hidden');
            } catch (err) {
                errorText.textContent = 'فشل الاتصال: ' + err.message;
                errorContainer.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = 'بدء التحقيق الشامل';
                spinner.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
